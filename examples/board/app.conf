# =============================================
# Board Server 설정 파일
# =============================================

# 서버
host       = 0.0.0.0
port       = 8888


# ---------------------------------------------
# MySQL / MariaDB
# ---------------------------------------------
db_type    = MYSQL
db_host    = 127.0.0.1
db_port    = 3306
db_user    = db_user
db_pass    = db_pass
db_name    = db_name
db_charset = utf8mb4


# ---------------------------------------------
# PostgreSQL
# ---------------------------------------------
#db_type    = PGSQL
#db_host    = 127.0.0.1
#db_port    = 5432
#db_user    = db_user
#db_pass    = db_pass
#db_name    = db_name
#db_charset = UTF8


# ---------------------------------------------
# SQLite
# db_name은 base_dir 기준 상대경로
# ---------------------------------------------
#db_type    = SQLITE
#db_name    = examples/board/board.db  


# 경로
base_dir   = /home/ftp_id/libcore
upload_dir = examples/board/uploads
tpl_dir    = examples/board/templates

# 파일 업로드 최대 용량 (기본 10MB)
max_upload_size = 10485760

# 로그
log_level  = debug
log_file   = logs/board.log
