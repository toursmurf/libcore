<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🌻 Chat Demo  </title>
    <style>
        /* 💡 Windows 98 / ICQ Classic Color Palette */
        :root {
            --win-gray: #C0C0C0;
            --win-white: #FFFFFF;
            --win-dark-gray: #808080;
            --win-navy: #000080;
            --sys-yellow: #FFFFD9;
            --sys-green: #D9FFD9;
        }

        body {
            background-color: #55aaaa; /* Classic Teal Desktop */
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 💡 Main Window Frame */
        #window-frame {
            background-color: var(--win-gray);
            border: 2px solid;
            border-color: var(--win-white) var(--win-dark-gray) var(--win-dark-gray) var(--win-white);
            width: 750px;
            height: 600px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        /* 💡 Title Bar */
        #title-bar {
            background: linear-gradient(90deg, var(--win-navy), #1084d0);
            color: white;
            padding: 3px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
        }

        .title-buttons div {
            width: 16px;
            height: 14px;
            background-color: var(--win-gray);
            border: 1px solid;
            border-color: var(--win-white) var(--win-dark-gray) var(--win-dark-gray) var(--win-white);
            color: black;
            text-align: center;
            line-height: 12px;
            font-size: 10px;
            display: inline-block;
            cursor: default;
        }

        /* 💡 Chat Layout */
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            padding: 5px;
            gap: 5px;
        }

        #main-chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #chat-log {
            flex: 1;
            background-color: var(--win-white);
            border: 2px inset var(--win-dark-gray);
            overflow-y: scroll;
            padding: 5px;
            font-size: 13px;
            line-height: 1.5;
        }

        /* 💡 Right Sidebar */
        #sidebar {
            width: 200px;
            background-color: var(--win-white);
            border: 2px inset var(--win-dark-gray);
            display: flex;
            flex-direction: column;
        }

        #sidebar-header {
            background-color: var(--win-gray);
            padding: 4px 5px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid var(--win-dark-gray);
            text-align: center;
        }

        #user-list {
            flex: 1;
            padding: 5px;
            list-style: none;
            margin: 0;
            font-size: 12px;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            cursor: default;
        }

        /* Status Indicators 🟢🟡🔴 */
        .status-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #333; }
        .status-online { background-color: #00FF00; box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3); }
        .status-away { background-color: #FFFF00; box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3); }
        .status-busy { background-color: #FF0000; box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3); }

        .uin-text { font-size: 10px; color: #666; margin-right: 4px; }

        /* 💡 Input Area */
        #input-area { display: flex; gap: 5px; padding: 2px; }
        input[type="text"] { border: 2px inset var(--win-dark-gray); padding: 5px; outline: none; background-color: var(--win-white); font-family: inherit; }
        button { background-color: var(--win-gray); border: 2px solid; border-color: var(--win-white) var(--win-dark-gray) var(--win-dark-gray) var(--win-white); padding: 4px 15px; font-family: inherit; font-size: 12px; font-weight: bold; cursor: pointer; }
        button:active:not(:disabled) { border-color: var(--win-dark-gray) var(--win-white) var(--win-white) var(--win-dark-gray); padding: 5px 14px 3px 16px; /* 누르는 3D 효과 극대화 */ }
        button:disabled { color: #888; }

        /* 💡 Emoji Picker */
        #emoji-panel {
            position: absolute; bottom: 50px; right: 220px; background: var(--win-gray); border: 2px solid; border-color: var(--win-white) var(--win-dark-gray) var(--win-dark-gray) var(--win-white); display: none; grid-template-columns: repeat(5, 1fr); padding: 5px; gap: 5px; z-index: 100;
        }
        .emoji-item { cursor: pointer; font-size: 18px; padding: 2px; text-align: center; }
        .emoji-item:hover { background-color: var(--win-navy); color: white; }

        /* 💡 Log Styles */
        .log-line { margin: 0; padding: 2px 4px; white-space: pre-wrap; border-bottom: 1px dotted #e0e0e0; }
        .sys-line { background-color: var(--sys-yellow); color: #555; font-style: italic; }
        .join-line { background-color: var(--sys-green); font-weight: bold; color: #005500; }

        /* 💡 Login Modal */
        #login-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.4); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #login-box { background-color: var(--win-gray); border: 2px solid; border-color: var(--win-white) var(--win-dark-gray) var(--win-dark-gray) var(--win-white); width: 340px; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        #login-title { background: var(--win-navy); color: white; padding: 3px 5px; font-weight: bold; font-size: 12px; display: flex; justify-content: space-between; }
        #login-content { padding: 20px; text-align: center; font-size: 13px; }
        #login-content input { width: 80%; margin: 15px 0; padding: 6px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <div id="login-title">
            <span>Chat Demo - User Identification</span>
            <div class="title-buttons"><div style="color:black; background:#c0c0c0; border:1px solid; border-color:#fff #808080 #808080 #fff; width:14px; height:12px; line-height:10px; font-size:10px;">X</div></div>
        </div>
        <div id="login-content">
            <p style="margin-top:0; font-weight:bold;">Welcome to Iron Fortress</p>
            <p style="margin:5px 0; font-size:11px; color:#444;">할당받을 닉네임을 입력하십시오. UIN은 자동 생성됩니다.</p>
            <input type="text" id="name-input" placeholder="Nickname..." maxlength="10">
            <div style="margin-top: 10px;">
                <button onclick="startChat()">System Login</button>
            </div>
        </div>
    </div>
</div>

<div id="window-frame">
    <div id="title-bar">
        <div>🌻 PingRoom (ICQ Edition) - Connected to libcore Engine</div>
        <div class="title-buttons"><div>_</div><div>[]</div><div style="font-weight: bold;">X</div></div>
    </div>

    <div id="chat-container">
        <div id="main-chat-area">
            <div id="chat-log"></div>
            <div id="input-area">
                <input type="text" id="msg-input" placeholder="Ready..." style="flex: 1;" disabled>
                <button id="emoji-btn" onclick="toggleEmoji()" disabled>😊</button>
                <button id="send-btn" onclick="sendMsg()" disabled>전송</button>
            </div>
        </div>

        <div id="sidebar">
            <div id="sidebar-header">Users Online (<span id="user-count">0</span>)</div>
            <ul id="user-list"></ul>
        </div>
    </div>

    <div id="emoji-panel">
        <span class="emoji-item" onclick="addEmoji('😊')">😊</span><span class="emoji-item" onclick="addEmoji('😂')">😂</span>
        <span class="emoji-item" onclick="addEmoji('👍')">👍</span><span class="emoji-item" onclick="addEmoji('🔥')">🔥</span>
        <span class="emoji-item" onclick="addEmoji('🚀')">🚀</span><span class="emoji-item" onclick="addEmoji('💡')">💡</span>
        <span class="emoji-item" onclick="addEmoji('🔫')">🔫</span><span class="emoji-item" onclick="addEmoji('💻')">💻</span>
        <span class="emoji-item" onclick="addEmoji('🍓')">🍓</span><span class="emoji-item" onclick="addEmoji('☕')">☕</span>
    </div>
</div>

<script>
    let ws = null;
    let myName = "";
    let myUIN = "";
    let myStatus = "online"; // online, away, busy
    let idleTimer = null;
    let participants = new Map(); // Key: UIN, Value: { name, status }

    const loginOverlay = document.getElementById("login-overlay");
    const chatLog = document.getElementById("chat-log");
    const msgInput = document.getElementById("msg-input");
    const emojiBtn = document.getElementById("emoji-btn");
    const sendBtn = document.getElementById("send-btn");
    const userList = document.getElementById("user-list");
    const userCount = document.getElementById("user-count");
    const emojiPanel = document.getElementById("emoji-panel");

    // 🔊 [핵심 기능 1] 순수 Web Audio API를 이용한 ICQ "Uh-Oh!" 사운드 생성기
    function playUhOh() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();

            const playTone = (freq, type, startTime, duration, vol) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type; // 'square' 파형이 레트로 8비트 기계음 느낌을 줍니다!
                osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);

                gain.gain.setValueAtTime(vol, ctx.currentTime + startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + startTime);
                osc.stop(ctx.currentTime + startTime + duration);
            };

            // 짧고 높은 "어(Uh)!" -> 약간 낮고 긴 "오(Oh)!"
            playTone(440, 'square', 0, 0.12, 0.05);
            playTone(330, 'square', 0.15, 0.20, 0.05);
        } catch(e) { console.log("Audio not supported"); }
    }

    function getTime() {
        const d = new Date();
        return `[${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}:${d.getSeconds().toString().padStart(2, '0')}]`;
    }

    function startChat() {
        const nameInput = document.getElementById("name-input");
        myName = nameInput.value.trim();

        if (!myName) {
            alert("System Error: 닉네임이 필요합니다.");
            return;
        }

        // 🔢 [핵심 기능 2] 7자리 UIN 자동 할당 (ex. 1048293)
        myUIN = Math.floor(1000000 + Math.random() * 9000000).toString();

        loginOverlay.style.display = "none";
        msgInput.disabled = false;
        emojiBtn.disabled = false;
        sendBtn.disabled = false;
        msgInput.placeholder = "Type message...";
        msgInput.focus();

        // Audio Context 권한 확보를 위해 클릭 시 한번 빈 소리 재생 (브라우저 정책 우회)
        try { new (window.AudioContext || window.webkitAudioContext)().resume(); } catch(e){}

        const host = window.location.hostname || "127.0.0.1";
        ws = new WebSocket(`ws://${host}:8080`);

        ws.onopen = () => {
            renderLine(`${getTime()} System: 서버와 연결되었습니다. Handshake OK...`, "sys");

            // C 서버는 이 JSON을 받아서 모든 클라이언트에게 뿌려줍니다 (Dumb Relay 활용!)
            const announcePacket = { type: "announce", uin: myUIN, name: myName, status: myStatus };
            ws.send(JSON.stringify(announcePacket));

            // 내 상태를 서버에 전파하기 위한 핑(Ping)
            setInterval(() => {
                if(ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "ping", uin: myUIN, name: myName, status: myStatus }));
                }
            }, 5000);

            setupActivityTracker(); // 상태 트래커 가동
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                // 1. 누군가 입장 (Announce)
                if (data.type === "announce" || data.type === "ping") {
                    const isNew = !participants.has(data.uin);
                    participants.set(data.uin, { name: data.name, status: data.status });
                    updateUserList();

                    if (data.type === "announce" && isNew) {
                        if (data.uin === myUIN) {
                            renderLine(`${getTime()} System: UIN [${myUIN}] 발급 완료. 진입신고 수리!`, "join");
                        } else {
                            renderLine(`${getTime()} System: User ${data.name} (UIN:${data.uin}) 님이 접속했습니다.`, "sys");
                        }
                    }
                }
                // 2. 상태 변경 (Status)
                else if (data.type === "status") {
                    if (participants.has(data.uin)) {
                        participants.get(data.uin).status = data.status;
                        updateUserList();
                    }
                }
                // 3. 채팅 메시지 (Chat)
                else if (data.type === "chat") {
                    if (data.uin !== myUIN) {
                        playUhOh(); // 🔊 메세지 수신 시 어-오! 재생
                        renderLine(`${getTime()} ${data.name}: ${data.content}`);
                    }
                }
                // 4. C 서버 자체 퇴장 처리 (FD 기반이라 정확한 UIN 매칭은 안되지만 로깅용)
                else if (data.type === "leave") {
                    renderLine(`${getTime()} System: 소켓 연결 종료 감지 (${data.from})`, "sys");
                    // 10초 이상 핑이 없는 유저는 클라이언트단에서 주기적으로 청소할 수 있음.
                }
            } catch (e) { }
        };

        ws.onclose = () => renderLine(`${getTime()} System: ❌ 서버와의 연결이 끊어졌습니다.`, "sys");
    }

    function sendMsg() {
        const val = msgInput.value.trim();
        if (val && ws) {
            renderLine(`${getTime()} 나: ${val}`);
            ws.send(JSON.stringify({ type: "chat", uin: myUIN, name: myName, content: val }));
            msgInput.value = "";
            emojiPanel.style.display = "none";
            resetIdleTimer(); // 타자 쳤으니 온라인 상태 복귀
        }
    }

    function renderLine(text, type = "") {
        const div = document.createElement("div");
        div.className = `log-line ${type ? type + '-line' : ''}`;
        div.innerText = text;
        chatLog.appendChild(div);
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    function updateUserList() {
        userList.innerHTML = "";
        userCount.innerText = participants.size;

        participants.forEach((info, uin) => {
            const li = document.createElement("li");
            li.className = "user-item";

            const isMe = uin === myUIN;
            const displayName = isMe ? `${info.name} (나)` : info.name;
            const statusClass = `status-${info.status}`;

            li.innerHTML = `
                <div class="status-dot ${statusClass}" title="${info.status}"></div>
                <span class="uin-text">[${uin}]</span>
                <span>${displayName}</span>
            `;
            userList.appendChild(li);
        });
    }

    // 🟢🟡🔴 [핵심 기능 3] 상태 추적 시스템 (Online / Away / Busy)
    function changeStatus(newStatus) {
        if (myStatus !== newStatus) {
            myStatus = newStatus;
            if (participants.has(myUIN)) participants.get(myUIN).status = myStatus;
            updateUserList();
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "status", uin: myUIN, status: myStatus }));
            }
        }
    }

    function resetIdleTimer() {
        if (myStatus === "away") changeStatus("online"); // 돌아오면 온라인
        clearTimeout(idleTimer);
        // 테스트를 위해 10초(10000ms) 무반응 시 자리비움 처리. (실제론 3~5분 권장)
        idleTimer = setTimeout(() => { changeStatus("away"); }, 10000);
    }

    function setupActivityTracker() {
        // 마우스, 키보드 움직이면 타이머 리셋
        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('keydown', resetIdleTimer);

        // 창이 가려지거나 최소화되면 즉시 Busy 🔴
        window.addEventListener('blur', () => { changeStatus("busy"); });
        // 창으로 돌아오면 일단 Online 🟢 으로 복귀하고 타이머 재개
        window.addEventListener('focus', () => {
            changeStatus("online");
            resetIdleTimer();
        });

        resetIdleTimer(); // 최초 시작
    }

    function toggleEmoji() {
        emojiPanel.style.display = emojiPanel.style.display === "grid" ? "none" : "grid";
    }

    function addEmoji(emoji) {
        msgInput.value += emoji;
        msgInput.focus();
        resetIdleTimer();
    }

    // 엔터키 및 보안 처리
    document.getElementById("name-input").addEventListener("keypress", (e) => { if (e.key === "Enter") startChat(); });
    msgInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMsg(); });
    window.addEventListener('keydown', function(e) {
        if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
            e.preventDefault();
            renderLine(`${getTime()} System: 🛡️ 요새 보안: 강제 새로고침 시도가 차단되었습니다.`, "sys");
        }
    });
</script>
</body>
</html>
