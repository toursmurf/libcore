<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>단톡방얘재</title>
    <style>
        :root { --kakao-blue: #bacee0; --kakao-yellow: #ffeb33; --kakao-white: #ffffff; --kakao-system: rgba(0, 0, 0, 0.1); }
        body { background-color: var(--kakao-blue); margin: 0; font-family: sans-serif; display: flex; justify-content: center; }
        #chat-container { width: 100%; max-width: 450px; height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        #chat-log { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        #chat-log::-webkit-scrollbar { width: 0; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .msg-bubble { padding: 8px 12px; border-radius: 5px; font-size: 14px; line-height: 1.5; word-break: break-all; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .system-msg { align-self: center; background-color: var(--kakao-system); color: #fff; font-size: 11px; padding: 4px 15px; border-radius: 15px; margin: 10px 0; }
        .other { align-self: flex-start; align-items: flex-start; }
        .other .user-name { font-size: 12px; margin-bottom: 4px; color: #333; }
        .other .msg-bubble { background-color: var(--kakao-white); border-top-left-radius: 0; }
        .self { align-self: flex-end; align-items: flex-end; }
        .self .msg-bubble { background-color: var(--kakao-yellow); border-top-right-radius: 0; }
        #input-area { background: #fff; padding: 10px; display: flex; gap: 8px; }
        #msg-input { flex: 1; border: 1px solid #ddd; padding: 10px; border-radius: 20px; outline: none; font-size: 14px;}
        #send-btn { background-color: var(--kakao-yellow); border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div id="chat-container">
    <div id="chat-log"></div>
    <div id="input-area">
        <input type="text" id="msg-input" placeholder="메시지 입력" autofocus>
        <button id="send-btn" onclick="sendMsg()">전송</button>
    </div>
</div>
<script>
    // ✅ 접속 주소 자동 감지
    const host = window.location.hostname || "127.0.0.1";
    const myName = "test_" + Math.floor(Math.random() * 1000);
    const ws = new WebSocket(`ws://${host}:8080`);
    const chatLog = document.getElementById("chat-log");
    const input = document.getElementById("msg-input");

    ws.onopen = () => renderSystem("🟡 단톡방 접속 성공!");
    ws.onclose = () => renderSystem("❌ 서버와 연결이 끊어졌습니다.");

    ws.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            if (data.type === "chat") {
                // ✅ 내가 보낸 건 무시! (화면에 중복으로 찍히는 현상 방지)
                if (data.from !== myName) {
                    renderMessage(data.from || "익명", data.content || "", false);
                }
            } else if (data.type === "join") {
                renderSystem(`${data.from}님이 들어왔습니다.`);
            } else if (data.type === "leave") {
                renderSystem(`${data.from}님이 나갔습니다.`);
            }
        } catch (e) { console.error("데이터 파싱 에러:", event.data); }
    };

    function sendMsg() {
        const val = input.value.trim();
        if (val) {
            const packet = { type: "chat", from: myName, content: val };
            ws.send(JSON.stringify(packet));
            renderMessage(myName, val, true); // ✅ 내가 쓴 건 내가 직접 즉시 화면에 그림!
            input.value = "";
        }
    }

    function renderMessage(user, msg, isSelf) {
        const wrapper = document.createElement("div");
        wrapper.className = `msg-wrapper ${isSelf ? 'self' : 'other'}`;
        if (!isSelf) {
            const name = document.createElement("div"); name.className = "user-name"; name.innerText = user; wrapper.appendChild(name);
        }
        const bubble = document.createElement("div"); bubble.className = "msg-bubble"; bubble.innerText = msg;
        wrapper.appendChild(bubble); chatLog.appendChild(wrapper); chatLog.scrollTop = chatLog.scrollHeight;
    }

    function renderSystem(msg) {
        const div = document.createElement("div"); div.className = "system-msg"; div.innerText = msg;
        chatLog.appendChild(div); chatLog.scrollTop = chatLog.scrollHeight;
    }

    input.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMsg(); });

    // ==========================================
    // 🛡️ 강제 새로고침(F5) 및 이탈 방어
    // ==========================================

    // 1. 키보드 F5 및 Ctrl+R 차단
    window.addEventListener('keydown', function(e) {
        if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || (e.ctrlKey && e.key === 'R')) {
            e.preventDefault(); // 브라우저의 기본 새로고침 동작을 씹어버립니다!!
            renderSystem("🛡️ 요새 보안: 강제 새로고침(F5) 시도가 차단되었습니다.");
        }
    });

    // 2. 마우스로 브라우저 새로고침 버튼(↻) 누르거나 창 닫기 방어
    window.addEventListener('beforeunload', function (e) {
        // 브라우저 표준 경고창을 띄워 진짜로 나갈 건지 물어봅니다!
        e.preventDefault();
        e.returnValue = '';
    });

</script>
</body>
</html>
